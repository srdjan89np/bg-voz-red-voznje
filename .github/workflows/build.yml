name: Build APK / AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing key
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nema KEYSTORE_BASE64 secret-a – pravim samo debug APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (debug APK)
        if: steps.sign.outputs.signed != 'true'
        run: |
          gradle :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk bg-voz.apk

      - name: Build (signed release APK + AAB for Google Play)
        if: steps.sign.outputs.signed == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease :app:bundleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk bg-voz.apk
          cp app/build/outputs/bundle/release/app-release.aab bg-voz-google-play.aab

      - uses: actions/upload-artifact@v4
        with:
          name: bg-voz
          path: |
            bg-voz.apk
            bg-voz-google-play.aab
          if-no-files-found: ignore

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Najnovija verzija
          body: |
            Automatski napravljeno iz poslednje izmene (verzija 1.0.${{ github.run_number }}).
            - bg-voz.apk – instaliraj direktno na Android telefon
            - bg-voz-google-play.aab – fajl za Google Play Console (pojavi se kad su dodati ključevi za potpisivanje)
          files: |
            bg-voz.apk
            bg-voz-google-play.aab
          fail_on_unmatched_files: false
          make_latest: true
